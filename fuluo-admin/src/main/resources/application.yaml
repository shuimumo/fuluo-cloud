server:
  port: 8084

spring:
  application:
    name: fuluo-admin
  config:
    import:
      - optional:nacos:fuluo-common.yaml?group=DEFAULT_GROUP
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        file-extension: yaml
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:3306/fuluogame?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PWD:123456}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 2000ms
  rabbitmq:
    host: ${RABBIT_HOST:127.0.0.1}
    port: 5672
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PWD:guest}
    virtual-host: /
    template:
      retry:
        enabled: true
        max-attempts: 3
        initial-interval: 1000ms

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.shuimumu.fuluogame.entity
  configuration:
    map-underscore-to-camel-case: true

aliyun:
  oss:
    bucket-name: sky-take-out-wnxby
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: ${OSS_AK:***REMOVED-SECRET***}
    access-key-secret: ${OSS_SK:***REMOVED-SECRET***}
  green:
    access-key-id: ${GREEN_AK:***REMOVED-SECRET***}
    access-key-secret: ${GREEN_SK:***REMOVED-SECRET***}

knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  group-configs:
    - group: 'admin'
      packages-to-scan: com.shuimumu.fuluogame.controller

logging:
  level:
    com.shuimumu.fuluogame: info
