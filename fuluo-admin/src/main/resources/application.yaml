server:
  port: 8084

spring:
  application:
    name: fuluo-admin
  config:
    import:
      - nacos:fuluo-common.yaml?group=DEFAULT_GROUP
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 3000
  data:
    redis:
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 2000ms
  rabbitmq:
    template:
      retry:
        enabled: true
        max-attempts: 3
        initial-interval: 1000ms

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.shuimumu.fuluogame.entity
  configuration:
    map-underscore-to-camel-case: true

knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  group-configs:
    - group: 'admin'
      packages-to-scan: com.shuimumu.fuluogame.controller

logging:
  level:
    com.shuimumu.fuluogame: info