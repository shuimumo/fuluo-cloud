# ================================================================
# Nacos 配置中心 —— 公共配置（Data ID: fuluo-common.yaml, Group: DEFAULT_GROUP, 格式: YAML）
#
# 作用：所有微服务通过 spring.config.import 拉取本文件，集中管理共享基础设施连接信息
#   - 连接信息只维护这一份，改一处、全部服务生效（Nacos 动态刷新，无需重启）
#   - 各服务本地 application.yaml 只保留"服务私有配置"（端口、路由、AI、knife4j 等）
#   - 不使用环境变量占位符，值直接写死在这里
#
# 发布方式（docker compose 启动时由 nacos-config-init 容器自动发布本文件）：
#   curl -X POST "http://127.0.0.1:8848/nacos/v3/admin/cs/config" ^
#     --data-urlencode dataId=fuluo-common.yaml ^
#     --data-urlencode groupName=DEFAULT_GROUP ^
#     --data-urlencode type=yaml ^
#     --data-urlencode content@nacos-config/fuluo-common.yaml
# ================================================================

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/fuluogame?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    virtual-host: /
  elasticsearch:
    uris: http://127.0.0.1:9200

elasticsearch:
  host: 127.0.0.1
  port: 9200

aliyun:
  oss:
    bucket-name: sky-take-out-wnxby
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: ***REMOVED-SECRET***
    access-key-secret: ***REMOVED-SECRET***
  green:
    access-key-id: ***REMOVED-SECRET***
    access-key-secret: ***REMOVED-SECRET***