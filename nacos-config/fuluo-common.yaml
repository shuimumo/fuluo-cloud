# ================================================================
# Nacos 配置中心 —— 公共配置（Data ID: fuluo-common.yaml, Group: DEFAULT_GROUP, 格式: YAML）
#
# 作用：所有微服务通过 spring.config.import 拉取本文件，集中管理共享基础设施连接信息
#   - 连接信息只维护这一份，改一处、全部服务生效（Nacos 动态刷新，无需重启）
#   - 各服务本地 application.yaml 只保留"服务私有配置"（端口、路由、AI、knife4j 等）
#   - 不使用环境变量占位符，值直接写死在这里
#
# 发布方式（docker compose 启动时由 nacos-config-init 容器自动发布本文件）：
#   curl -X POST "http://127.0.0.1:8848/nacos/v3/admin/cs/config" ^
#     --data-urlencode dataId=fuluo-common.yaml ^
#     --data-urlencode groupName=DEFAULT_GROUP ^
#     --data-urlencode type=yaml ^
#     --data-urlencode content@nacos-config/fuluo-common.yaml
# ================================================================

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/fuluogame?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    # P0 修复：口令外部化，禁止在仓库提交明文；生产环境务必用环境变量注入，勿使用默认弱口令
    password: ${MYSQL_ROOT_PASSWORD:123456}
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PWD:guest}
    virtual-host: /
    # P1 修复：发布端可靠性。correlated 确认 + mandatory 退回，
    # 由 RabbitReliabilityConfig 注册 Confirm/Returns 回调记录失败，消除"路由失败却返回成功"的静默丢消息。
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # P1 修复：毒消息治理。消费端重试耗尽后不再无限 requeue，改由队列挂载的 DLX 死信（见 RabbitMQConfig），
        # 运维监控 fuluo.dlx.queue 深度即可发现毒消息。
        default-requeue-rejected: false
  elasticsearch:
    uris: http://127.0.0.1:9200

elasticsearch:
  host: 127.0.0.1
  port: 9200

# P0 修复：阿里云 AK/SK 一律外部化（原明文已泄露，务必去控制台轮换）。
# enabled 默认 false：未显式开启时相关 SDK Bean 不加载、服务仍可启动；
# 此时审核走 fail-safe（保持待审核，不放行），OSS 上传返回"未配置"业务错误。
aliyun:
  oss:
    enabled: ${ALIYUN_OSS_ENABLED:false}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME}
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
  green:
    enabled: ${ALIYUN_GREEN_ENABLED:false}
    access-key-id: ${ALIYUN_GREEN_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_GREEN_ACCESS_KEY_SECRET:}

# 审核开关：默认开启（安全默认）。压测/联调时通过 FULUO_MODERATION_ENABLED=false 显式关闭后直接放行。
fuluo:
  moderation:
    enabled: ${FULUO_MODERATION_ENABLED:true}
