server:
  port: 8086

spring:
  application:
    name: fuluo-search
  config:
    import:
      - nacos:fuluo-common.yaml?group=DEFAULT_GROUP
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 2000
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 3000
  data:
    redis:
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 2000ms
  rabbitmq:
    listener:
      simple:
        prefetch: 10
        concurrency: 3
        max-concurrency: 5
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 1000ms
          multiplier: 2
          max-attempts: 3
          max-interval: 10s

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.shuimumu.fuluogame.entity
  configuration:
    map-underscore-to-camel-case: true


knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  group-configs:
    - group: 'search'
      packages-to-scan: com.shuimumu.fuluogame.controller

logging:
  level:
    com.shuimumu.fuluogame: info