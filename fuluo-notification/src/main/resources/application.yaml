server:
  port: 8087

spring:
  application:
    name: fuluo-notification
  config:
    import:
      - nacos:fuluo-common.yaml?group=DEFAULT_GROUP
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
  datasource:
    hikari:
      maximum-pool-size: 12
      minimum-idle: 3
      connection-timeout: 3000
  rabbitmq:
    listener:
      simple:
        prefetch: 20
        concurrency: 2
        max-concurrency: 4
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 1000ms
          multiplier: 2
          max-attempts: 3
          max-interval: 10s
    template:
      retry:
        enabled: true
        max-attempts: 3
        initial-interval: 1000ms

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.shuimumu.fuluogame.entity
  configuration:
    map-underscore-to-camel-case: true

knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  group-configs:
    - group: 'notification'
      packages-to-scan: com.shuimumu.fuluogame.controller

logging:
  level:
    com.shuimumu.fuluogame: info