services:
  canal-server:
    image: canal/canal-server:v1.1.7
    container_name: canal-server
    restart: unless-stopped
    ports:
      - "11111:11111"
    networks:
      fuluogame:
        aliases:
          - canal-server
    environment:
      DOCKER_DEPLOY_TYPE: VM
      canal.serverMode: rabbitMQ
      canal.auto.scan: "true"
      canal.instance.master.address: mysql8:3306
      canal.instance.dbUsername: canal
      canal.instance.dbPassword: ${CANAL_DB_PASSWORD:?set CANAL_DB_PASSWORD to the MySQL canal user password}
      canal.instance.connectionCharset: UTF-8
      canal.instance.filter.regex: "fuluogame\\.(post|comment)"
      canal.mq.flatMessage: "true"
      canal.mq.canalBatchSize: "50"
      canal.mq.canalGetTimeout: "100"
      canal.mq.topic: cdc.change
      canal.mq.partition: "0"
      rabbitmq.host: rabbitmq:5672
      rabbitmq.virtual.host: /
      rabbitmq.exchange: canal.cdc
      rabbitmq.username: guest
      rabbitmq.password: guest
      rabbitmq.queue: cdc.post.change
      rabbitmq.routingKey: cdc.change
      # Canal 1.1.7 calls this value as exchangeDeclare(type), not message delivery mode.
      rabbitmq.deliveryMode: topic
    volumes:
      - canal-logs:/home/admin/canal-server/logs
      - ./start-canal.sh:/opt/fuluo/start-canal.sh:ro
    command: ["/bin/bash", "/opt/fuluo/start-canal.sh"]
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -q '[C]analLauncher' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

networks:
  fuluogame:
    external: true

volumes:
  canal-logs:
